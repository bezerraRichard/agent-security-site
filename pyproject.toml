[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security"
version = "0.3.0"
description = "Passive HTTP security crawler for authorized sites, with HTML/JSON reports, Bitsight-aligned rules, OneTrust cookie classification and a Streamlit console."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
console = ["streamlit>=1.46"]
pac = ["pypac>=0.18"]  # Evaluates PAC proxy scripts on macOS and Linux (Windows uses WinHTTP).
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agent-security = "agent_security.cli:main"
agent-security-console = "agent_security.console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_security.console" = ["*.svg"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/agent_security/report.py" = ["E501"]  # inline CSS/HTML templates
"tests/*" = ["E501", "C408", "RUF005", "RUF012"]  # dense fixtures; class-level mutable state in fake servers

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pypac", "pypac.*"]
ignore_missing_imports = true
