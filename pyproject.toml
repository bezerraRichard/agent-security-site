[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security"
version = "0.2.0"
description = "Passive HTTP security crawler for authorized sites, with HTML/JSON reports and OneTrust cookie classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agent-security = "agent_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/agent_security/report.py" = ["E501"]  # inline CSS/HTML templates
"tests/*" = ["E501", "C408", "RUF005", "RUF012"]  # dense fixtures; class-level mutable state in fake servers

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
